# Front door for the Graphiti MCP server (/add-graphiti).
#
# The MCP SDK's FastMCP auto-enables DNS-rebinding protection at construction
# (host defaults to 127.0.0.1) and Graphiti rebinds to 0.0.0.0 afterwards
# without clearing it, so any Host other than localhost / 127.0.0.1 gets
# 421 Misdirected Request. Agents reach the server as host.docker.internal,
# and fetch() will not let a client override Host — so the rewrite happens
# here, on the host side of the bridge, where it is not agent-controllable.
server {
    listen 8000;

    location / {
        proxy_pass http://graphiti-mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8000;
        proxy_set_header Connection "";

        # Streamable HTTP answers with SSE; pass it through unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
