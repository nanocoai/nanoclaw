name: CI

on:
  pull_request:
    branches: [main]
  # A post-merge run on main, so main itself carries a verdict and not only the
  # pull requests that fed it. Nothing below reads the pull_request payload.
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Host tests
        run: pnpm exec vitest run

      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  iron-front:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: .claude/skills/add-iron-proxy/front-proxy/go.sum
      - name: Verify stock Iron and front proxy
        shell: bash
        run: |
          set -euo pipefail
          skill="$GITHUB_WORKSPACE/.claude/skills/add-iron-proxy"
          source_dir="$RUNNER_TEMP/stock-iron-source"
          source_url=$(jq -r '."iron-proxy-source"' "$skill/versions.json")
          revision=$(jq -r '."iron-proxy-commit"' "$skill/versions.json")
          git init "$source_dir"
          git -C "$source_dir" remote add origin "$source_url"
          git -C "$source_dir" fetch --depth=1 origin "$revision"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          cp -R "$skill/front-proxy" "$source_dir/_front-proxy"
          cd "$source_dir/_front-proxy"
          go test -mod=readonly -race -count=1 ./...
          test -z "$(gofmt -l .)"
          git -C "$source_dir" diff --exit-code

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: [test, iron-front]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.iron-front.result }}" = success

  # The single check the main ruleset will require, in every repo under the same
  # name. It needs `ci` as well as `test` so the older required context and the
  # new one cannot disagree. if: always() because a skipped required check is
  # not a failed one.
  gate:
    name: gate
    if: always()
    needs: [test, iron-front, ci]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.ci.result }}" = success
          test "${{ needs.iron-front.result }}" = success
