name: CI

on:
  pull_request:
    branches: [main]
  # A post-merge run on main, so main itself carries a verdict and not only the
  # pull requests that fed it. Nothing below reads the pull_request payload.
  push:
    branches: [main]

# The static checks, the host suite and the container suite are independent,
# so each gets its own runner and the gate waits for the slowest one, not the
# sum. The host suite is cut into shards; vitest assigns files to a shard by a
# hash of their path, so every file runs in exactly one shard.
env:
  HOST_TEST_SHARDS: 4

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version: [22, 24]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile

      - name: Host tests, shard ${{ matrix.shard }} of ${{ env.HOST_TEST_SHARDS }}
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ env.HOST_TEST_SHARDS }}

  container-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  iron-front:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: .claude/skills/add-iron-proxy/front-proxy/go.sum
      - name: Verify stock Iron and front proxy
        shell: bash
        run: |
          set -euo pipefail
          skill="$GITHUB_WORKSPACE/.claude/skills/add-iron-proxy"
          source_dir="$RUNNER_TEMP/stock-iron-source"
          source_url=$(jq -r '."iron-proxy-source"' "$skill/versions.json")
          revision=$(jq -r '."iron-proxy-commit"' "$skill/versions.json")
          git init "$source_dir"
          git -C "$source_dir" remote add origin "$source_url"
          git -C "$source_dir" fetch --depth=1 origin "$revision"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          cp -R "$skill/front-proxy" "$source_dir/_front-proxy"
          cd "$source_dir/_front-proxy"
          go test -mod=readonly -race -count=1 ./...
          test -z "$(gofmt -l .)"
          git -C "$source_dir" diff --exit-code

  # Skill pins sit outside the lockfile; .github/skill-pins mirrors them so
  # Dependabot and audit tools can see them. Red when the mirror is stale, or
  # when the signal-cli download hash is not GitHub's digest for its release.
  skill-pins:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skill-pins:check
      - name: signal-cli pin matches its release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=setup/install-signal-cli.sh
          if [ "$(grep -cE '\b(VERSION|SHA256)=' "$f")" != 2 ]; then
            echo "::error file=$f::expected exactly one VERSION= line and one SHA256= line"
            exit 1
          fi
          v=$(sed -n 's/^VERSION="\([0-9.]*\)"$/\1/p' "$f")
          sha=$(sed -n 's/^SHA256="\([0-9a-f]*\)"$/\1/p' "$f")
          digest=$(gh api "repos/AsamK/signal-cli/releases/tags/v$v" \
            --jq ".assets[] | select(.name == \"signal-cli-$v-Linux-native.tar.gz\") | .digest")
          if [ "$digest" != "sha256:$sha" ]; then
            echo "::error file=$f::SHA256 is not GitHub's digest for v$v (${digest:-none}). If this PR bumps VERSION, set SHA256=\"${digest#sha256:}\". If it doesn't and SHA256 is unchanged too, the release asset changed after it was pinned: find out why before re-pinning, and don't re-pin in an unrelated PR."
            exit 1
          fi

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: [checks, test, container-test, iron-front, skill-pins]
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.container-test.result }}" = success
          test "${{ needs.iron-front.result }}" = success
          test "${{ needs.skill-pins.result }}" = success

  # The single check the main ruleset will require, in every repo under the same
  # name. It needs `ci` as well as `test` so the older required context and the
  # new one cannot disagree. if: always() because a skipped required check is
  # not a failed one.
  gate:
    name: gate
    if: always()
    needs: [checks, test, container-test, iron-front, skill-pins, ci]
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.container-test.result }}" = success
          test "${{ needs.ci.result }}" = success
          test "${{ needs.iron-front.result }}" = success
          test "${{ needs.skill-pins.result }}" = success
