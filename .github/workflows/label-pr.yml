name: Label PR

# SECURITY: this workflow runs with write access to the base repo on fork PRs,
# because `pull_request_target` executes in the context of the base branch.
# Keep it metadata-only — do NOT add actions/checkout or any step that
# executes PR-supplied content (install scripts, build commands, etc.).
# See https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
#
# The labeling logic lives inline between the NANOCLAW-LABEL-LOGIC markers as a
# pure function; scripts/label-pr-workflow.test.ts extracts that exact block
# from this file and runs fixture tests against it, so the tested code and the
# shipped code cannot drift. Edit the function only between the markers.
on:
  pull_request_target:
    # Pushes refresh both the primary area and the per-commit status.
    types: [opened, edited, reopened, ready_for_review, synchronize]

# One label writer per PR. Serialize edits and pushes, then read fresh API
# state rather than the triggering event's label snapshot. Targeted mutations
# preserve unrelated labels even if a maintainer adds one during this run.
concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read # area rules from the trusted base commit, without checkout
      issues: write # targeted label changes and the single compliance comment
      statuses: write # report-only template-compliance commit status
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            // NANOCLAW-LABEL-LOGIC-START
            // Pure decisions, exercised directly by the workflow tests.
            // Emit only modern classifications. Legacy automation labels are
            // retired on the next normal PR event, not in a repository sweep.
            // Drop fenced code blocks (``` and ~~~, any info string). A line
            // scanner rather than a regex so an UNTERMINATED fence hides
            // everything after it instead of nothing, and so ``` cannot close
            // a ~~~ fence. Fences must be flush-left, like the checkbox
            // tokens they protect.
            function stripFences(text) {
              const out = [];
              let fence = null;
              for (const line of text.split('\n')) {
                const open = /^(`{3,}|~{3,})/.exec(line);
                if (open) {
                  if (fence === null) {
                    fence = open[1][0];
                    continue;
                  }
                  if (line[0] === fence) {
                    fence = null;
                    continue;
                  }
                  continue; // a ``` line inside a ~~~ fence (or vice versa) stays hidden
                }
                if (fence === null) out.push(line);
              }
              return out.join('\n');
            }

            // The managed kind vocabulary, shared by the two functions that
            // must agree on it: computeLabels emits from this set, and
            // decideCompliance reads it to decide whether a PR is classified.
            // One declaration, so the two can never drift apart.
            const MANAGED_KINDS = ['kind/bug', 'kind/feature', 'kind/documentation', 'kind/cleanup', 'kind/hardening'];

            function selectPrimaryArea(files, areaRules) {
              const rules = Object.entries(areaRules);
              for (const [area, patterns] of rules) {
                if (!/^area\/[a-z][a-z-]*$/.test(area) || !Array.isArray(patterns) || !patterns.length) {
                  throw new Error('Invalid primary-area configuration');
                }
                for (const pattern of patterns) {
                  if (typeof pattern !== 'string' || !pattern || pattern.startsWith('/') ||
                      pattern.split('/').includes('..') || /[\*?\[\]{}\\]/.test(pattern.replace(/\/\*\*$|\*$/, ''))) {
                    throw new Error(`Unsupported primary-area path pattern: ${pattern}`);
                  }
                }
              }
              const votes = new Map();
              for (const file of files) {
                // Renames count once, under their destination path.
                const filename = typeof file === 'string' ? file : file.filename;
                let best;
                for (const [area, patterns] of rules) {
                  for (const pattern of patterns) {
                    const directory = pattern.endsWith('/**');
                    const prefix = pattern.endsWith('*');
                    const literal = directory ? pattern.slice(0, -2) : prefix ? pattern.slice(0, -1) : pattern;
                    const matches = directory ? filename.startsWith(literal)
                      : prefix ? filename.startsWith(literal) && !filename.slice(literal.length).includes('/')
                      : filename === literal;
                    if (matches && (!best || literal.length > best.specificity ||
                        (literal.length === best.specificity && area < best.area))) {
                      best = { area, specificity: literal.length };
                    }
                  }
                }
                if (best) {
                  const vote = votes.get(best.area) || { area: best.area, count: 0, specificity: 0 };
                  vote.count++;
                  vote.specificity = Math.max(vote.specificity, best.specificity);
                  votes.set(best.area, vote);
                }
              }
              // One vote per file after choosing its most-specific owner. On a count
              // tie, prefer the more-specific match, then the lexical area name.
              return [...votes.values()].sort((a, b) => b.count - a.count || b.specificity - a.specificity ||
                (a.area < b.area ? -1 : a.area > b.area ? 1 : 0))[0]?.area;
            }

            function computeLabels({ body, title, currentLabels = [], files = [], areaRules = {} }) {
              body = body || '';
              title = title || '';
              const current = new Set(currentLabels);
              const scanned = stripFences(body);
              const retired = ['PR: Fix', 'PR: Feature', 'PR: Docs', 'PR: Refactor', 'PR: Skill',
                'core-team', 'follows-guidelines'];
              const titleKinds = { fix: 'kind/bug', feat: 'kind/feature', docs: 'kind/documentation',
                refactor: 'kind/cleanup', chore: 'kind/cleanup', ci: 'kind/cleanup', test: 'kind/cleanup',
                build: 'kind/cleanup', style: 'kind/cleanup', perf: 'kind/cleanup' };
              let kind;
              let skill = current.has('delivery/skill');
              if (body.includes('<!-- nanoclaw-pr-template:v2 -->')) {
                const checked = MANAGED_KINDS.filter((value) =>
                  new RegExp('^-\\s*\\[[xX]\\]\\s*`' + value + '`', 'm').test(scanned));
                if (checked.length === 1) kind = checked[0];
                const isSkill = /^-\s*\[[xX]\]\s*Skill:/m.test(scanned);
                const notSkill = /^-\s*\[[xX]\]\s*Not a skill/m.test(scanned);
                if (isSkill !== notSkill) skill = isSkill;
              } else {
                // Continue understanding old templates without their duplicate labels.
                if (scanned.includes('[x] **Feature skill**') || scanned.includes('[x] **Utility skill**') ||
                    scanned.includes('[x] **Operational/container skill**')) {
                  kind = 'kind/feature';
                  skill = true;
                } else if (scanned.includes('[x] **Fix**')) kind = 'kind/bug';
                else if (scanned.includes('[x] **Simplification**')) kind = 'kind/cleanup';
                else if (scanned.includes('[x] **Documentation**')) kind = 'kind/documentation';
              }
              if (!kind) {
                // A single maintainer classification wins over an advisory title.
                const existing = MANAGED_KINDS.filter((value) => current.has(value));
                const prefix = /^([a-z]+)(\([^)]*\))?!?:/.exec(title.trim());
                kind = existing.length === 1 ? existing[0]
                  : prefix && Object.hasOwn(titleKinds, prefix[1]) ? titleKinds[prefix[1]] : undefined;
              }
              const area = selectPrimaryArea(files, areaRules);
              const add = [...(kind ? [kind] : []), ...(skill ? ['delivery/skill'] : []), ...(area ? [area] : [])];
              const desired = new Set(add);
              const managed = new Set([...MANAGED_KINDS, 'delivery/skill', ...Object.keys(areaRules), ...retired]);
              return { add, remove: currentLabels.filter((value) => managed.has(value) && !desired.has(value)) };
            }

            // Report-only template compliance (CI-04: the classification
            // check runs and reports long before it is ever required).
            //   - v2-marker body with a kind classification (parser verdict,
            //     title fallback, or an already-applied managed kind) →
            //     'success'.
            //   - v2-marker body with no classification at all → 'failure':
            //     a red X on the commit status, deliberately NOT in the
            //     required-checks list, so the PR stays mergeable and nothing
            //     is ever auto-closed.
            //   - v1 / no-marker bodies → null: untouched, no status at all.
            function decideCompliance({ body, add, currentLabels }) {
              if (!(body || '').includes('<!-- nanoclaw-pr-template:v2 -->')) return { state: null };
              const classified =
                add.some((l) => MANAGED_KINDS.includes(l)) ||
                (currentLabels || []).some((l) => MANAGED_KINDS.includes(l));
              return { state: classified ? 'success' : 'failure' };
            }

            // One fix-instructions comment per PR, ever — not one per push.
            // The hidden marker identifies our comment; a marker hit from any
            // earlier run suppresses a new one.
            const COMPLIANCE_COMMENT_MARKER = '<!-- nanoclaw-template-compliance -->';
            function shouldPostComplianceComment(state, existingCommentBodies) {
              if (state !== 'failure') return false;
              return !(existingCommentBodies || []).some((b) => (b || '').includes(COMPLIANCE_COMMENT_MARKER));
            }
            // NANOCLAW-LABEL-LOGIC-END

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            // GitHub caps this endpoint at 3,000 files. Do not classify partial evidence.
            if (files.length < pr.changed_files) throw new Error('Incomplete PR file list; leaving labels unchanged');
            const config = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path: '.github/pr-label-areas.json', ref: context.sha,
            });
            if (typeof config.data.content !== 'string' || config.data.encoding !== 'base64') {
              throw new Error('Primary-area rules must be a file at the trusted base commit');
            }
            const areaRules = JSON.parse(Buffer.from(config.data.content, 'base64').toString('utf8'));
            const currentLabels = (pr.labels || []).map((label) => label.name);
            const { add, remove } = computeLabels({ body: pr.body, title: pr.title, currentLabels, files, areaRules });

            // ── Report-only template-compliance status (every event) ──
            const compliance = decideCompliance({ body: pr.body, add, currentLabels: currentLabels.filter((label) => !remove.includes(label)) });
            if (compliance.state !== null) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: compliance.state,
                context: 'template-compliance',
                description:
                  compliance.state === 'success'
                    ? 'PR carries a kind classification'
                    : 'No kind classification — check one kind/* box (report-only, does not block merge)',
              });
              if (compliance.state === 'failure') {
                // Paginate: the 'one comment ever' guarantee is a check-then-act
                // over the whole comment list, so reading only the first page
                // would re-post on any PR whose discussion has outgrown it.
                // github.paginate returns the flat array, not a { data } envelope.
                const existing = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                if (shouldPostComplianceComment(compliance.state, existing.map((c) => c.body))) {
                  // Static text only — never interpolate PR-controlled content
                  // into a comment posted with write permissions.
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: [
                      COMPLIANCE_COMMENT_MARKER,
                      'This PR uses the v2 template but has no kind classification, so the report-only `template-compliance` status is red. It does not block merging.',
                      '',
                      'To fix, either:',
                      '- check exactly one box in the **Change kind** section (`kind/bug`, `kind/feature`, `kind/documentation`, `kind/cleanup`, or `kind/hardening`), or',
                      '- give the PR a conventional-commit title (`fix:`, `feat:`, `docs:`, `refactor:`, `chore:`, `ci:`, `test:`, `build:`, `style:`, `perf:`) and edit the description to re-trigger labeling.',
                      '',
                      'A maintainer can also apply a `kind/*` label directly. Applying the label does not clear this status on its own: the status is recalculated on the next push or description edit.',
                    ].join('\n'),
                  });
                }
              }
            }

            // Removals first, and only of labels actually on the PR, so an
            // edited kind selection swaps cleanly instead of accumulating.
            const current = new Set((pr.labels || []).map((l) => l.name));
            for (const name of remove) {
              if (!current.has(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name,
                });
              } catch (e) {
                if (e.status !== 404) throw e; // 404: already gone
              }
            }

            const missing = add.filter((name) => !current.has(name));
            if (missing.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: missing,
              });
            }
