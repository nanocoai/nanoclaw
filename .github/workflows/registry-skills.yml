name: Registry skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_sha:
        description: Full core commit SHA to promote
        required: true
        type: string
      providers_sha:
        description: Full providers commit SHA to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The skill matrix below is written out so every skill job starts at once
  # instead of waiting for a discovery job. This guard keeps the list honest:
  # red when a skill directory appears or changes without the matrix following.
  discover:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The matrix lists exactly the registry skills on disk
        run: |
          found=$(pnpm exec tsx scripts/test-registry-skills.ts --list \
            | node -e 'const l = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(JSON.stringify(l.map(({ skill, bun }) => ({ skill, bun }))))')
          listed=$(node -e 'const w = require("yaml").parse(require("fs").readFileSync(".github/workflows/registry-skills.yml", "utf8")); console.log(JSON.stringify(w.jobs.test.strategy.matrix.include))')
          if [ "$found" != "$listed" ]; then
            echo "::error file=.github/workflows/registry-skills.yml::the test matrix does not match the registry skills on disk"
            echo "on disk: $found"
            echo "listed:  $listed"
            exit 1
          fi

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { skill: add-codex, bun: true }
          - { skill: add-copilot, bun: true }
          - { skill: add-cursor, bun: true }
          - { skill: add-deltachat, bun: false }
          - { skill: add-dial, bun: false }
          - { skill: add-discord, bun: false }
          - { skill: add-emacs, bun: false }
          - { skill: add-gchat, bun: false }
          - { skill: add-github, bun: false }
          - { skill: add-imessage, bun: false }
          - { skill: add-linear, bun: false }
          - { skill: add-matrix, bun: false }
          - { skill: add-mattermost, bun: false }
          - { skill: add-opencode, bun: true }
          - { skill: add-resend, bun: false }
          - { skill: add-signal, bun: false }
          - { skill: add-slack, bun: false }
          - { skill: add-teams, bun: false }
          - { skill: add-telegram, bun: false }
          - { skill: add-webex, bun: false }
          - { skill: add-wechat, bun: false }
          - { skill: add-whatsapp, bun: false }
          - { skill: add-whatsapp-cloud, bun: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.bun
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Image layer cache
        id: image-cache
        if: ${{ matrix.bun }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache
          key: agent-image-${{ runner.os }}-${{ hashFiles('container/Dockerfile', 'container/agent-runner/package.json', 'container/agent-runner/bun.lock', 'container/cli-tools.json', 'container/install-cli-tools.sh', 'container/entrypoint.sh') }}
          restore-keys: agent-image-${{ runner.os }}-
      - name: Cached container runtime for the skill's image build
        if: ${{ matrix.bun }}
        run: .github/scripts/install-cached-container-runtime.sh
      - name: Apply and test ${{ matrix.skill }}
        env:
          REGISTRY_PROVIDERS_SHA: ${{ inputs.providers_sha }}
          IMAGE_CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: pnpm exec tsx scripts/test-registry-skills.ts "${{ matrix.skill }}"

  combined-providers:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Install, refresh, and verify all providers
        env:
          REGISTRY_PROVIDERS_SHA: ${{ inputs.providers_sha }}
        run: pnpm exec tsx scripts/test-registry-skills.ts --combined-providers

  pre-contract-providers:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Apply pre-contract Codex and OpenCode payloads to current core
        run: pnpm exec tsx scripts/test-registry-skills.ts --pre-contract-providers

  old-provider-refresh:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One job per legacy provider, and one with both in the same tree: the
      # two skills edit the same provider barrels, so their refresh together
      # is its own case.
      matrix:
        include:
          - { legacy: codex, skills: add-codex }
          - { legacy: opencode, skills: add-opencode }
          - { legacy: both, skills: '' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Image layer cache
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache
          # Its own key: the image built here comes from the old trunk's
          # Dockerfile, so a hit on the main key would skip saving its layers.
          key: agent-image-legacy-99283f3e-${{ runner.os }}-${{ hashFiles('container/Dockerfile', 'container/agent-runner/package.json', 'container/agent-runner/bun.lock', 'container/cli-tools.json', 'container/install-cli-tools.sh', 'container/entrypoint.sh') }}
          restore-keys: |
            agent-image-legacy-99283f3e-${{ runner.os }}-
            agent-image-${{ runner.os }}-
      - name: Cached container runtime for the skill's image build
        run: .github/scripts/install-cached-container-runtime.sh
      - name: Install legacy providers, then refresh them to the current payload
        env:
          REGISTRY_PROVIDERS_SHA: ${{ inputs.providers_sha }}
          IMAGE_CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: pnpm exec tsx scripts/test-registry-skills.ts --old-provider-refresh 99283f3e274b2b1dae47b141ac4f11f56ad8eb2d ${{ matrix.skills }}

  provider-payload-switch:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.core_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # d61af17b is the last trunk whose provider skills copied from the providers branch.
      - name: Refresh branch-installed providers to their skill payloads
        env:
          REGISTRY_PROVIDERS_SHA: ${{ inputs.providers_sha }}
        run: pnpm exec tsx scripts/test-registry-skills.ts --provider-payload-switch d61af17b541f52632c6194692a166184839a926f

  provider-promotion:
    if: always()
    needs: [test, combined-providers, pre-contract-providers, old-provider-refresh, provider-payload-switch]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every provider composition gate
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.combined-providers.result }}" = success
          test "${{ needs.pre-contract-providers.result }}" = success
          test "${{ needs.old-provider-refresh.result }}" = success
          test "${{ needs.provider-payload-switch.result }}" = success

  # The one check the main ruleset will require from this workflow, in the
  # shape of `gate` in ci.yml. It needs every job above, provider-promotion
  # included, so the older verdict and this one cannot disagree. if: always()
  # because a skipped required check is not a failed one. Nothing in this
  # workflow is conditional on the event: every job runs on pull_request, push
  # and workflow_dispatch alike, so only `success` passes and a skip fails.
  registry-gate:
    name: registry gate
    if: always()
    needs: [discover, test, combined-providers, pre-contract-providers, old-provider-refresh, provider-payload-switch, provider-promotion]
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        run: |
          test "${{ needs.discover.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.combined-providers.result }}" = success
          test "${{ needs.pre-contract-providers.result }}" = success
          test "${{ needs.old-provider-refresh.result }}" = success
          test "${{ needs.provider-payload-switch.result }}" = success
          test "${{ needs.provider-promotion.result }}" = success
