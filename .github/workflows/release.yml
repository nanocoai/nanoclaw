name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to release (x.y.z, or x.y.z-beta.N / x.y.z-rc.N for a pre-release; no v prefix)
        required: true
        type: string
      target_sha:
        description: Full 40-character SHA of the merged release commit
        required: true
        type: string
      mode:
        description: Verify first; publish only after reviewing the verification summary
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Verify dispatch source
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REPOSITORY" != "nanocoai/nanoclaw" ]; then
            echo "::error::Release runs only in nanocoai/nanoclaw; got $DISPATCH_REPOSITORY."
            exit 1
          fi
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Select the main branch when dispatching Release; got $DISPATCH_REF."
            exit 1
          fi

  verify:
    needs: dispatch
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}
      # Git only, before any setup action: pnpm and node tooling load files from the checkout.
      - name: Verify target is on main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          git fetch --force origin main:refs/remotes/origin/main --tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Verify protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Neither environment blocks self-review. Stable releases still need a second person:
          # the publish job's "Check stable publish approval" step fails a self-approval unless the
          # approver is on its allowlist. Same rule as the publish job's environment expression;
          # release.mjs verify rejects any '-' suffix other than -beta.N or -rc.N. Kept in shell so
          # older target commits still verify.
          case "$RELEASE_VERSION" in *-*) ENVIRONMENT=prerelease ;; *) ENVIRONMENT=release ;; esac
          case "$ENVIRONMENT" in
            release)
              EXPECTED_REVIEWERS='["amit-shafnir","gavrielc","glifocat","omri-maya","zvi-fried"]'
              PREVENT_SELF_REVIEW=false
              ;;
            prerelease)
              EXPECTED_REVIEWERS='["glifocat"]'
              PREVENT_SELF_REVIEW=false
              ;;
          esac

          if ! gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}" > "$RUNNER_TEMP/release-environment.json"; then
            echo "::error::Create and protect the $ENVIRONMENT environment before publishing."
            exit 1
          fi

          if ! jq -e --argjson prevent "$PREVENT_SELF_REVIEW" '
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([.protection_rules[] | select(.type == "required_reviewers")][0].prevent_self_review == $prevent) and
            all(
              [.protection_rules[] | select(.type == "required_reviewers")][0].reviewers[];
              .type == "User"
            )
          ' "$RUNNER_TEMP/release-environment.json" >/dev/null; then
            echo "::error::The $ENVIRONMENT environment must have one user-reviewer rule with prevent_self_review=$PREVENT_SELF_REVIEW, prevent admin bypass, and use custom branch policies."
            exit 1
          fi

          ACTUAL_REVIEWERS=$(jq -c '
            [.protection_rules[] | select(.type == "required_reviewers") | .reviewers[].reviewer.login]
            | sort
          ' "$RUNNER_TEMP/release-environment.json")
          if [ "$ACTUAL_REVIEWERS" != "$EXPECTED_REVIEWERS" ]; then
            echo "::error::Release reviewer roster drift ($ENVIRONMENT): expected $EXPECTED_REVIEWERS, got $ACTUAL_REVIEWERS. Update the workflow and RELEASING.md together in a reviewed pull request."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}/deployment-branch-policies" \
            > "$RUNNER_TEMP/release-branch-policies.json"
          if ! jq -e '
            .total_count == 1 and
            any(.branch_policies[]; .name == "main" and (.type // "branch") == "branch")
          ' "$RUNNER_TEMP/release-branch-policies.json" >/dev/null; then
            echo "::error::The $ENVIRONMENT environment must allow exactly the main branch."
            exit 1
          fi

      - name: Verify main protects the release workflow
        if: ${{ !contains(inputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The stable self-approval allowlist lives in this file, so a change under .github/ must
          # need a team's approval on main: a ruleset "required reviewers" rule, nothing negated.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/rules/branches/main?per_page=100" --jq '.[]' \
            | jq -s '.' > "$RUNNER_TEMP/main-rules.json"
          if ! jq -e '
            any(.[] | select(.type == "pull_request") | .parameters.required_reviewers[]?;
              .reviewer.type == "Team" and .minimum_approvals >= 1
              and any(.file_patterns[]; . == ".github/**")
              and all(.file_patterns[]; startswith("!") | not))
          ' "$RUNNER_TEMP/main-rules.json" >/dev/null; then
            echo "::error::main must require a team's approval (at least 1) for .github/** through a ruleset's required-reviewers rule with no negated patterns. Stable self-approval is safe only under that rule."
            exit 1
          fi
          echo "::notice::main requires a team's approval for .github/**."

      - name: Verify release metadata and target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node scripts/release.mjs verify "$RELEASE_VERSION"
          # Order check from this workflow's own commit: an older target's release.mjs lacks it.
          # A failed lookup, an empty tag list or a missing success line fails the step.
          git ls-remote --tags --refs origin 'refs/tags/v*' > "$RUNNER_TEMP/release-tags.txt"
          git show "$GITHUB_SHA:scripts/release.mjs" > "$RUNNER_TEMP/release-order.mjs"
          ORDER=$(node "$RUNNER_TEMP/release-order.mjs" order "$RELEASE_VERSION" "$RUNNER_TEMP/release-tags.txt")
          test "$ORDER" = "v${RELEASE_VERSION} sorts above every existing tag of its version"

          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists; publish mode will verify its exact state."
          fi
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              echo "::error::$TAG exists but is not an annotated tag"
              exit 1
            fi
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
              echo "::error::$TAG already resolves to $TAG_SHA, not workflow target $TARGET_SHA"
              exit 1
            fi
            echo "::notice::$TAG already targets $TARGET_SHA; publish can resume safely."
          fi

          {
            echo "### Release verification"
            echo "- Version: \`$TAG\`"
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Pre-release: \`$([[ "$RELEASE_VERSION" == *-* ]] && echo yes || echo no)\`"
            echo "- Previous stable tag: \`$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$TARGET_SHA^")\`"
            echo "- Mode: \`${{ inputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          node scripts/release.mjs extract "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Install host dependencies
        run: pnpm install --frozen-lockfile
      - name: Install agent-runner dependencies
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Typecheck host
        run: pnpm exec tsc --noEmit
      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit
      - name: Host tests
        run: pnpm exec vitest run
      - name: Container tests
        working-directory: container/agent-runner
        run: bun run test

  publish:
    if: inputs.mode == 'publish'
    needs: verify
    runs-on: ubuntu-26.04
    # Both environments must be created and protected before the workflow lands.
    # GitHub otherwise auto-creates an unprotected environment on first use.
    # Only x.y.z-beta.N and x.y.z-rc.N pass verify with a '-'; the verify job checks this same environment.
    environment: ${{ contains(inputs.version, '-') && 'prerelease' || 'release' }}
    permissions:
      actions: read
      contents: write
    steps:
      # First step, before checkout: nothing from the target commit runs until it passes.
      - name: Check stable publish approval
        if: ${{ !contains(inputs.version, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Logins that may approve a stable publish they started or re-ran (space-separated).
          # Everyone else needs a second release reviewer. Change only in a reviewed pull request.
          SELF_APPROVAL_ALLOWLIST: glifocat
          RUN_ACTOR: ${{ github.actor }}
          RUN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # The release environment allows self-review, so this step keeps the two-person rule.
          # The history has no attempt numbers, so an approval in any attempt by the dispatcher or
          # this attempt's re-runner counts as theirs. Account IDs catch a renamed login.
          RUN_API="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "$RUN_API/attempts/${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/run-attempt.json"
          gh api "$RUN_API/approvals" > "$RUNNER_TEMP/run-approvals.json"
          DECISION=$(jq -n -c \
            --slurpfile attempt "$RUNNER_TEMP/run-attempt.json" \
            --slurpfile history "$RUNNER_TEMP/run-approvals.json" \
            --arg actor "$RUN_ACTOR" \
            --arg triggering "$RUN_TRIGGERING_ACTOR" \
            --arg allowlist "$SELF_APPROVAL_ALLOWLIST" '
            def login: if type == "string" and length > 0 then ascii_downcase else error("missing login") end;
            def id: if type == "number" then . else error("missing account id") end;
            ($attempt[0] | [.actor, .triggering_actor]) as $people
            | ($history[0] | if type == "array" then . else error("approval history is not a list") end) as $reviews
            | [$people[] | .id | id] as $starter_ids
            | ([$people[] | .login | login] + ([$actor, $triggering] | map(login))) as $starter_logins
            | [$people[] | select(.type != "User") | .login] as $apps
            | [$allowlist | ascii_downcase | splits("\\s+") | select(. != "")] as $allowed
            | [$reviews[]
                | select(.state == "approved" and any(.environments[]; .name | ascii_downcase == "release"))
                | {id: (.user.id | id), login: (.user.login | login)}]
            | unique_by(.id) as $approvals
            | [$approvals[] | select(IN(.id; $starter_ids[]) or IN(.login; $starter_logins[])) | .login] as $self
            | [$self[] | select(IN($allowed[]) | not)] as $refused
            | {approvers: ($approvals | map(.login) | join(", "))}
            + if ($apps | length) > 0 then
                {ok: false, result: "started by \($apps | unique | join(", ")), not a person"}
              elif ($approvals | length) == 0 then
                {ok: false, result: "no approval of the release environment in this run"}
              elif ($refused | length) > 0 then
                {ok: false, result: "self-approved by \($refused | join(", ")), who is not on SELF_APPROVAL_ALLOWLIST"}
              elif ($self | length) > 0 then
                {ok: true, result: "self-approved by allowlisted maintainer \($self | join(", "))"}
              else
                {ok: true, result: "approved by a second person"}
              end
          ')
          RESULT=$(jq -r .result <<< "$DECISION")
          {
            echo "### Publish approval"
            echo "- Started by: \`$RUN_ACTOR\` (this attempt: \`$RUN_TRIGGERING_ACTOR\`)"
            echo "- Approved by: \`$(jq -r .approvers <<< "$DECISION")\`"
            echo "- Result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          # A later signed-tag requirement (e.g. a YubiKey-signed tag for allowlisted
          # self-approvals) goes here, before the step passes.
          if [ "$(jq -r .ok <<< "$DECISION")" != true ]; then
            echo "::error::Stable publish refused: $RESULT. A person dispatches a stable release, and a release reviewer other than whoever started or re-ran it approves it, unless that person is on SELF_APPROVAL_ALLOWLIST. Dispatch a fresh run."
            exit 1
          fi
          echo "::notice::Publish approval: $RESULT."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Re-verify immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase 40-character commit SHA"
            exit 1
          fi
          # Prove the target is on main before running any of its code.
          git fetch --force origin main:refs/remotes/origin/main --tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          # Order check from this workflow's own commit: an older target's release.mjs lacks it.
          # A failed lookup, an empty tag list or a missing success line fails the step.
          git ls-remote --tags --refs origin 'refs/tags/v*' > "$RUNNER_TEMP/release-tags.txt"
          git show "$GITHUB_SHA:scripts/release.mjs" > "$RUNNER_TEMP/release-order.mjs"
          ORDER=$(node "$RUNNER_TEMP/release-order.mjs" order "$RELEASE_VERSION" "$RUNNER_TEMP/release-tags.txt")
          test "$ORDER" = "v${RELEASE_VERSION} sorts above every existing tag of its version"
          node scripts/release.mjs verify "$RELEASE_VERSION"

          TAG="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              echo "::error::$TAG exists but is not an annotated tag"
              exit 1
            fi
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
              echo "::error::$TAG already resolves to $TAG_SHA, not workflow target $TARGET_SHA"
              exit 1
            fi
          fi

      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          # Contributors and the compare link cover everything since the last stable release.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$TARGET_SHA^")

          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$TARGET_SHA" \
            -f previous_tag_name="$PREVIOUS_TAG" \
            --jq .body > "$RUNNER_TEMP/generated-notes.md"

          node scripts/release.mjs assemble "$RELEASE_VERSION" \
            "$RUNNER_TEMP/generated-notes.md" > "$RUNNER_TEMP/release-notes.md"

      - name: Create annotated tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"

          write_tag_state() {
            if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
              jq -n \
                --arg type "$(git cat-file -t "$TAG")" \
                --arg sha "$(git rev-list -n 1 "$TAG")" \
                '{exists: true, type: $type, sha: $sha}' > "$RUNNER_TEMP/tag-state.json"
            else
              jq -n '{exists: false}' > "$RUNNER_TEMP/tag-state.json"
            fi
          }

          write_release_state() {
            gh api --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\")" \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -s '.' > "$RUNNER_TEMP/release-matches.json"
            MATCH_COUNT=$(jq 'length' "$RUNNER_TEMP/release-matches.json")
            if [ "$MATCH_COUNT" -gt 1 ]; then
              echo "::error::Found multiple GitHub Releases for $TAG"
              exit 1
            fi
            jq '.[0] // null' "$RUNNER_TEMP/release-matches.json" > "$RUNNER_TEMP/release-state.json"
          }

          write_tag_state
          write_release_state
          PLAN=$(node scripts/release.mjs plan "$RELEASE_VERSION" "$TARGET_SHA" \
            "$RUNNER_TEMP/tag-state.json" "$RUNNER_TEMP/release-state.json" \
            "$RUNNER_TEMP/release-notes.md")

          if [ "$PLAN" = "create-tag-and-release" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

          # A pre-release must never become /releases/latest, which the stable channel follows.
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            CHANNEL_FLAGS=(--prerelease --latest=false)
          else
            CHANNEL_FLAGS=(--latest)
          fi

          if [ "$PLAN" != "already-published" ]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              "${CHANNEL_FLAGS[@]}"
          else
            echo "::notice::GitHub Release $TAG already matches the requested publication; nothing to change."
          fi

          READBACK_ATTEMPTS=6
          READBACK_DELAY_SECONDS=2
          FINAL_STATE="pending"

          for ((attempt = 1; attempt <= READBACK_ATTEMPTS; attempt++)); do
            git fetch --force origin --tags
            write_tag_state
            write_release_state
            FINAL_STATE=$(node scripts/release.mjs readback "$RELEASE_VERSION" "$TARGET_SHA" \
              "$RUNNER_TEMP/tag-state.json" "$RUNNER_TEMP/release-state.json" \
              "$RUNNER_TEMP/release-notes.md")

            if [ "$FINAL_STATE" = "already-published" ]; then
              break
            fi
            if [ "$attempt" -eq "$READBACK_ATTEMPTS" ]; then
              echo "::error::Timed out waiting for GitHub to return the exact immutable release after $READBACK_ATTEMPTS attempts."
              node scripts/release.mjs plan "$RELEASE_VERSION" "$TARGET_SHA" \
                "$RUNNER_TEMP/tag-state.json" "$RUNNER_TEMP/release-state.json" \
                "$RUNNER_TEMP/release-notes.md"
              exit 1
            fi

            echo "::notice::Release read-back is still propagating (attempt $attempt/$READBACK_ATTEMPTS); retrying in ${READBACK_DELAY_SECONDS}s."
            sleep "$READBACK_DELAY_SECONDS"
            READBACK_DELAY_SECONDS=$((READBACK_DELAY_SECONDS * 2))
          done

          RELEASE_URL=$(jq -r .html_url "$RUNNER_TEMP/release-state.json")
          {
            echo "### Release publication"
            echo "- State: \`$FINAL_STATE\`"
            echo "- URL: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
